<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatillos CD Bávaro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Tablero de gatillos: mes arriba (cuántos días pasaron el gatillo y cuántos se analizaron), luego gatillos del año, detalle por indicador, datos, indicadores y registros de los Forms. */
:root{
  --bg:#f2f4f7; --surface:#fcfdfd; --sunken:#eef1f4;
  --ink:#0d1116; --ink-2:#465060; --muted:#677280;
  --line:#dde2e8; --axis:#b9c2cc;
  --accent:#1c5cab; --accent-ink:#ffffff; --series:#2a78d6;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --font:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-label:"IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1114; --surface:#171b20; --sunken:#11151a;
    --ink:#f3f5f7; --ink-2:#b8c0ca; --muted:#8a94a0;
    --line:#2a3039; --axis:#3b434e;
    --accent:#6da7ec; --accent-ink:#0d1116; --series:#3987e5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1114; --surface:#171b20; --sunken:#11151a;
  --ink:#f3f5f7; --ink-2:#b8c0ca; --muted:#8a94a0;
  --line:#2a3039; --axis:#3b434e;
  --accent:#6da7ec; --accent-ink:#0d1116; --series:#3987e5;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:22px 48px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3,p{margin:0}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:16px;font-weight:600;text-wrap:balance}
.lbl{font-family:var(--font-label);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.sub{color:var(--ink-2);overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.top > div:first-child{min-width:0;display:flex;flex-direction:column;gap:4px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,.btn{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--axis);border-radius:var(--r);padding:7px 12px;cursor:pointer;line-height:1.3}
button:hover,.btn:hover,select:hover{border-color:var(--ink-2)}
.btn.pri,button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.pri:hover,button.pri:hover{filter:brightness(1.08)}
button.quiet{border-color:transparent;background:transparent;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding-inline:6px}
button.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 50%,var(--axis))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.msg,.note{border:1px solid var(--crit);border-left-width:4px;background:var(--surface);padding:10px 14px;border-radius:var(--r);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.note{border-color:var(--warn)}
.note.ok{border-color:var(--good)}
.msg ul,.note ul{margin:4px 0 0;padding-left:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.sechead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.sechead > div:first-child:not(.monthbar):not(.row){display:flex;flex-direction:column;gap:3px;min-width:0}
body.dragging .wrap{outline:3px dashed var(--accent);outline-offset:-6px;border-radius:12px}
[hidden]{display:none!important}

.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--axis)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 14px 8px;color:var(--ink-2);font-weight:500;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.view{display:flex;flex-direction:column;gap:22px}

.monthbar{display:flex;align-items:center;gap:6px}
.monthbar strong{min-width:150px;text-align:center;font-size:15px}
.monthbar button{padding:6px 10px}

.month{display:grid;grid-template-columns:minmax(250px,4fr) minmax(0,8fr);gap:14px}
.hero{display:flex;flex-direction:column;gap:8px}
.hero .big{font-size:60px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.facts{display:flex;flex-direction:column;gap:3px;color:var(--ink-2);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.tile b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile small{color:var(--ink-2);font-size:12px}
.meter{height:8px;border-radius:4px;background:var(--trk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--st);border-radius:0 4px 4px 0}
.s-good{--st:var(--good);--trk:color-mix(in srgb,var(--good) 18%,var(--surface))}
.s-warn{--st:var(--warn);--trk:color-mix(in srgb,var(--warn) 24%,var(--surface))}
.s-crit{--st:var(--crit);--trk:color-mix(in srgb,var(--crit) 16%,var(--surface))}
.s-none{--st:var(--axis);--trk:var(--sunken)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.chip i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--st);color:#fff;font-size:10px;font-weight:700;line-height:1}
.chip.s-warn i{color:#1b1400}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-2)}
.legend .chip{font-weight:400}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-family:var(--font-label);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;border-bottom-color:var(--axis)}
thead th small{display:block;font-family:var(--font);font-size:10.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
td.r,th.r{text-align:right;white-space:nowrap}
td.c,th.c{text-align:center}
tr.area td{background:var(--sunken);font-weight:600;border-bottom-color:var(--axis)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunken)}
td.name button{border:0;background:none;padding:0;font:inherit;font-weight:500;color:var(--ink);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--axis);text-underline-offset:3px}
.cell{display:block;border-radius:4px;padding:3px 6px;background:var(--cellbg,transparent);white-space:nowrap}
.cell.s-good{--cellbg:color-mix(in srgb,var(--good) 20%,transparent)}
.cell.s-warn{--cellbg:color-mix(in srgb,var(--warn) 30%,transparent)}
.cell.s-crit{--cellbg:color-mix(in srgb,var(--crit) 18%,transparent)}
.cell.s-none{color:var(--muted)}
.bar{min-width:110px;width:18%}
.extra{color:var(--ink-2);font-size:12px}
.tag{display:inline-block;border:1px solid var(--axis);border-radius:999px;padding:0 8px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.tag.fx{border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;border-radius:999px;padding:2px 10px;background:var(--cellbg,transparent);border:1px solid var(--line);white-space:nowrap}
.pill.s-good{--cellbg:color-mix(in srgb,var(--good) 18%,transparent)}
.pill.s-warn{--cellbg:color-mix(in srgb,var(--warn) 28%,transparent)}
.pill.s-crit{--cellbg:color-mix(in srgb,var(--crit) 16%,transparent)}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* Matriz de gatillos */
.gm{min-width:980px}
.gm th,.gm td{padding:5px 6px}
.gm td.g{text-align:right;white-space:nowrap}
.gm td.g button{font:inherit;font-variant-numeric:tabular-nums;border:1px solid transparent;background:none;padding:3px 6px;border-radius:4px;width:100%;text-align:right;color:var(--ink)}
.gm td.g button:hover{border-color:var(--axis)}
.gm td.g button.fx{color:var(--accent);font-weight:600}
.gm td.g button.cur{box-shadow:inset 0 -2px 0 var(--accent)}
.gm td.g button.empty{color:var(--muted)}
.gm thead th.cur{color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:5px 12px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* Editor emergente */
.pop{position:fixed;inset:0;background:color-mix(in srgb,#000 35%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.pop .card{width:min(440px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);min-width:0}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=month],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--axis);border-radius:4px;padding:6px 9px;min-width:0;width:100%}
textarea{min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:12px;color:var(--ink-2)}
.rm{border:0;background:none;color:var(--muted);padding:4px 8px;font-size:17px;line-height:1}
.rm:hover{color:var(--crit)}

/* Gráfica diaria */
.chartbox{position:relative}
svg.ch{display:block;width:100%;height:auto;overflow:visible}
svg.ch text{fill:var(--muted);font-size:11px;font-family:var(--font)}
svg.ch .gl{stroke:var(--line)}
svg.ch .ax{stroke:var(--axis)}
svg.ch .ln{fill:none;stroke:var(--series);stroke-width:2}
svg.ch .gR{stroke:var(--crit);stroke-width:1.5;stroke-dasharray:6 4}
svg.ch .g5{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:3 3}
svg.ch circle{stroke:var(--surface);stroke-width:1.5}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-115%)}

/* Ajustes de catálogo */
.cat{min-width:1060px}
.cat td{padding:4px 5px;vertical-align:top}
.cat input,.cat select{width:100%;font-size:13px;padding:5px 7px}
.cat input.n{width:64px;text-align:right}
.reg td{vertical-align:top}
.reg .long{min-width:260px;max-width:420px;font-size:13px}
/* Plan de análisis */
.plan{min-width:980px}
.plan td{padding:4px 6px}
.plan td:nth-child(2){min-width:170px}
.plan input[type=text],.plan input[type=date]{font-size:13px;padding:5px 7px}
.plan input.resp{min-width:140px}
.plan input.nota{min-width:200px}
.plan tr.done td{color:var(--ink-2)}
details summary{cursor:pointer;color:var(--accent);font-weight:500;width:max-content}
/* Estado de la base de datos */
.dbst{border:0;background:none;padding:0;font:inherit;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--axis);text-underline-offset:3px}
.dbst::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--axis);margin-right:6px;vertical-align:1px}
.dbst[data-st="ok"]::before{background:var(--good)}
.dbst[data-st="busy"]::before{background:var(--warn)}
.dbst[data-st="err"]::before{background:var(--crit)}
.dbst[data-st="err"]{color:var(--crit)}
/* Menú de plantillas */
.menu{position:relative}
.menu>summary{list-style:none;color:var(--ink);font-weight:400;background:var(--surface);border:1px solid var(--axis);border-radius:var(--r);padding:7px 12px;line-height:1.3}
.menu>summary::-webkit-details-marker{display:none}
.menu>summary:hover{border-color:var(--ink-2)}
.menu .list{position:absolute;right:0;top:calc(100% + 4px);z-index:15;width:min(330px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 30px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;gap:2px}
.menu .list button{border:0;text-align:left;padding:8px 10px;display:flex;flex-direction:column;gap:1px;font-weight:500}
.menu .list button:hover{background:var(--sunken)}
.menu .list small{color:var(--ink-2);font-size:12px;font-weight:400}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.notes ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px;max-width:65ch}
.notes .card{display:flex;flex-direction:column;gap:4px}

@media (max-width:780px){
  .wrap{padding-inline:16px}
  .month{grid-template-columns:1fr}
  .hero .big{font-size:48px}
  .tabs button{padding:8px 10px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <span class="lbl">Herramientas de gestión · CD Bávaro</span>
      <h1>Gatillos y análisis de anomalías</h1>
      <p class="sub"><span id="status"></span> · <button type="button" class="dbst" data-act="clave" title="Base de datos compartida · clave de edición"><span id="sync">Base de datos…</span></button></p>
    </div>
    <div class="ctrls">
      <label class="btn pri" for="file">Cargar Excel<input id="file" class="vh" type="file" accept=".xlsx,.xls,.xlsm,.csv" multiple></label>
      <details class="menu">
        <summary>Descargar plantillas ▾</summary>
        <div class="list">
          <button type="button" data-act="tdatos">Datos diarios (vacía)<small>Para agregar datos y gatillos fijos. No borra nada al cargarla.</small></button>
          <button type="button" data-act="tplan">Plan de análisis (vacío)<small>Para subir relatos y 5XQ por hacer.</small></button>
          <button type="button" data-act="tplanmes">Plan de análisis con días por planificar<small>Ya trae los días del mes que estás viendo.</small></button>
          <button type="button" data-act="texport">Respaldo completo (con tus datos)<small>Indicadores, datos, gatillos fijos y plan. Al cargarlo reemplaza todo.</small></button>
        </div>
      </details>
      <button type="button" id="btnTheme">Tema</button>
    </div>
  </header>
  <div id="flash" aria-live="polite"></div>
  <nav class="tabs" role="tablist" aria-label="Vista">
    <button type="button" role="tab" data-view="mes">Mes</button>
    <button type="button" role="tab" data-view="plan">Plan de análisis</button>
    <button type="button" role="tab" data-view="gat">Gatillos del año</button>
    <button type="button" role="tab" data-view="det">Detalle por indicador</button>
    <button type="button" role="tab" data-view="dat">Datos</button>
    <button type="button" role="tab" data-view="ind">Indicadores</button>
    <button type="button" role="tab" data-view="reg">Relatos y 5XQ</button>
  </nav>
  <div id="view" class="view"></div>
</main>
<div id="pop" class="pop" hidden></div>
<script>

function fmt(v,u){

  var a=Math.abs(v);return v.toLocaleString('es-DO',{maximumFractionDigits:a>=1000?0:a>=10?2:3});
}
/* Convierte texto o número a la unidad interna. Tiempo: fracción de día. Porcentaje: decimal. */
function parseVal(x,u){
  if(x==null||x==='') return null;
  if(x instanceof Date){ if(u==='Tiempo'){return (x.getHours()*3600+x.getMinutes()*60+x.getSeconds())/86400;} return null; }
  if(typeof x==='number') return (u==='Porcentaje'&&Math.abs(x)>1.5)?x/100:x;
  var s=String(x).trim().replace(/\s/g,''); if(!s) return null;
  if(u==='Tiempo'||/^-?\d+:\d/.test(s)){
    var neg=s[0]==='-'; if(neg) s=s.slice(1);
    var p=s.split(':').map(Number); if(p.some(isNaN)) return null;
    while(p.length<3) p.push(0);

  else s=s.replace(/,/g,'');

/* Fechas: Date, número de serie de Excel o texto (AAAA-MM-DD, D/M/AAAA). */
function parseFecha(x){
  if(x==null||x==='') return null;
  if(x instanceof Date){ if(isNaN(x)) return null; var d=new Date(x.getTime()+ (x.getHours()>=23?3600000:0)); return ymd(d); }
  if(typeof x==='number'){ if(x<20000||x>80000) return null; var d2=new Date(Math.round((x-25569)*86400000)); return d2.getUTCFullYear()+'-'+pad(d2.getUTCMonth()+1)+'-'+pad(d2.getUTCDate()); }
  var s=String(x).trim(), m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){
    var a=+m[1],b=+m[2],y=+m[3]; if(y<100) y+=2000;
    var dd=a,mm=b; if(b>12&&a<=12){dd=b;mm=a;}

   En pruebas locales se puede apuntar a otro Worker con ?api=http://localhost:8787 */
var API=(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&new URLSearchParams(location.search).get('api'))||'https://gatillos-api.japf20092004.workers.dev';
var KEYK='gatillos-bvr-clave', KEYP='gatillos-bvr-pend', DB={ready:false, snap:null, busy:false, again:false, noKey:false, pidio:false, t:null};
function getClave(){try{return localStorage.getItem(KEYK)||'';}catch(_){return '';}}
function setClave(k){try{if(k)localStorage.setItem(KEYK,k);else localStorage.removeItem(KEYK);}catch(_){}}
function getPend(){try{return localStorage.getItem(KEYP)==='1';}catch(_){return false;}}
function setPend(on){try{if(on)localStorage.setItem(KEYP,'1');else localStorage.removeItem(KEYP);}catch(_){}}
function api(method,path,body){
  var h={'Content-Type':'application/json'}; if(method!=='GET') h['X-Clave']=getClave();
  return fetch(API+path,{method:method,headers:h,body:body===undefined?undefined:JSON.stringify(body)})
    .then(function(r){ if(!r.ok){var e=new Error('HTTP '+r.status); e.status=r.status; throw e;} return r.json(); });
}
function setSync(st,txt){var e=$('sync'); if(e){e.textContent=txt; e.parentNode.dataset.st=st;}}
function planLimpio(x){return {id:x.id,ind:x.ind,indN:x.indN||'',f:x.f,t:x.t,resp:x.resp||'',lim:x.lim||'',nota:x.nota||'',hecho:!!x.hecho};}
function regLimpio(r){var o={}; for(var k in r) if(k.charAt(0)!=='_') o[k]=r[k]; return o;}
/* Lo que se compara con la base: textos por sección, y por fila en datos y plan. */
function foto(s){
  var d={}, p={};
  for(var id in s.datos) for(var f in s.datos[id]) d[id+'|'+f]=s.datos[id][f].v+'|'+(s.datos[id][f].o||'');
  s.plan.forEach(function(x){p[x.id]=JSON.stringify(planLimpio(x));});
  return {ind:JSON.stringify(s.ind), fijos:JSON.stringify(s.fijos), cfg:JSON.stringify(s.cfg), regMeta:JSON.stringify(s.regMeta),
    R:JSON.stringify((s.regMeta||{}).R||null), '5':JSON.stringify((s.regMeta||{})['5']||null), d:d, p:p};
}
function trozos(a,n){var o=[]; for(var i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o;}
function sync(){
  if(!DB.ready||DB.noKey) return;
  if(DB.busy){DB.again=true; return;}
  var now=foto(S), old=DB.snap, jobs=[];
  ['ind','fijos','cfg','regMeta'].forEach(function(k){ if(now[k]!==old[k]) jobs.push(['PUT','/api/config/'+k,JSON.parse(now[k])]); });
  ['R','5'].forEach(function(t){ if(now[t]!==old[t]){
    var rows=S.reg.filter(function(r){return r.t===t;}).map(regLimpio), ps=trozos(rows,800); if(!ps.length) ps=[[]];
    ps.forEach(function(part,i){ jobs.push(['POST','/api/regs/'+t,{rows:part,first:i===0}]); });
  } });
  var put=[], del=[], k;
  for(k in now.d) if(now.d[k]!==old.d[k]){var a=k.split('|'), x=S.datos[a[0]][a[1]]; put.push([a[0],a[1],x.v,x.o||'']);}
  for(k in old.d) if(!(k in now.d)) del.push(k.split('|'));
  trozos(put,300).forEach(function(c){jobs.push(['POST','/api/datos',{put:c}]);});
  trozos(del,60).forEach(function(c){jobs.push(['POST','/api/datos',{del:c}]);});
  var pp=[], pd=[];
  for(k in now.p) if(now.p[k]!==old.p[k]) pp.push(JSON.parse(now.p[k]));
  for(k in old.p) if(!(k in now.p)) pd.push(k);
  trozos(pp,200).forEach(function(c){jobs.push(['POST','/api/plan',{put:c}]);});
  trozos(pd,90).forEach(function(c){jobs.push(['POST','/api/plan',{del:c}]);});
  if(!jobs.length){ setPend(false); setSync('ok','Guardado en la base'); return; }
  DB.busy=true; setSync('busy','Guardando en la base…');
  var i=0;
  (function next(){
    if(i>=jobs.length){ DB.snap=now; DB.busy=false; if(DB.again){DB.again=false; sync();} else {setPend(false); setSync('ok','Guardado en la base');} return; }
    var j=jobs[i++]; api(j[0],j[1],j[2]).then(next).catch(function(e){
      DB.busy=false; DB.again=false;
      if(e.status===401){ DB.noKey=true; setSync('err','No se guardó: falta la clave (toca aquí)'); if(!DB.pidio){DB.pidio=true; abrirClave();} }
      else { setSync('err','No se pudo guardar en la base · se reintenta'); clearTimeout(DB.t); DB.t=setTimeout(sync,20000); }
    });
  })();
}
function pull(){
  setSync('busy','Conectando con la base…');
  api('GET','/api/state').then(function(st){
    var c=st.config||{};
    var sdb={v:1, ind:c.ind||[], fijos:c.fijos||{}, cfg:c.cfg||{tol:1}, regMeta:c.regMeta||{}, reg:st.reg||[], plan:st.plan||[], datos:{}};
    (st.datos||[]).forEach(function(r){(sdb.datos[r[0]]=sdb.datos[r[0]]||{})[r[1]]={v:r[2],o:r[3]||''};});
    DB.snap=foto(sdb); DB.ready=true;
    if(!c.ind){ setSync('busy','Subiendo los datos a la base…'); sync(); return; }   // base vacía: se sube lo de este navegador
    if(getPend()){ sync(); return; }                                                    // cambios de este navegador sin subir
    S=sdb; invalidar(); guardarLocal(); render(); setSync('ok','Conectado a la base');
  }).catch(function(){ setSync('err','Sin conexión con la base · los cambios quedan en este navegador'); });
}

function indById(id){for(var i=0;i<S.ind.length;i++) if(S.ind[i].id===id) return S.ind[i]; return null;}
function activos(){return S.ind.filter(function(i){return i.activo;});}

/* ---------------- gatillos ---------------- */
/* Igual que las hojas mensuales del Excel: promedio ± k × desviación estándar (muestra) de los meses de historia.
   Mayor peor suma; Menor peor resta. Un gatillo fijo (escrito a mano) manda sobre el cálculo. */
var GC={};
function gatillo(ind,mes){
  var key=ind.id+'|'+mes; if(GC[key]) return GC[key];
  var desde=addMes(mes,-ind.meses)+'-01', hasta=addMes(mes,-1)+'-'+pad(diasMes(addMes(mes,-1)));
  var vals=[], dd=S.datos[ind.id]||{}, meses={};
  for(var f in dd){ if(f>=desde&&f<=hasta&&dd[f].v!=null){vals.push(dd[f].v); meses[f.slice(0,7)]=1;} }
  var r={desde:desde,hasta:hasta,n:vals.length,mesesCon:Object.keys(meses).length,prom:vals.length?mean(vals):null,sd:stdev(vals),calc:null,v:null,fuente:null};
  if(vals.length>=2&&!isNaN(r.sd)) r.calc= ind.sentido==='Mayor peor' ? r.prom+ind.k*r.sd : r.prom-ind.k*r.sd;
  var fx=(S.fijos[ind.id]||{})[mes];
  if(fx!=null){r.v=fx;r.fuente='fijo';} else if(r.calc!=null){r.v=r.calc;r.fuente='calc';}
  r.v5 = r.v==null?null : (ind.sentido==='Mayor peor' ? r.v-Math.abs(r.v)*ind.margen/100 : r.v+Math.abs(r.v)*ind.margen/100);
  GC[key]=r; return r;
}
function nivel(ind,v,g){
  if(v==null||g.v==null) return '';
  if(ind.sentido==='Mayor peor'){ if(v>g.v) return 'R'; if(v>g.v5) return '5'; }
  else { if(v<g.v) return 'R'; if(v<g.v5) return '5'; }
  return 'ok';
}

/* ---------------- registros de los Forms ---------------- */
function aliasSet(ind){
  var a={}, pl={}; a[norm(ind.nombre)]=1;
  ind.alias.forEach(function(s){ if(s.indexOf('|')>=0) pl[norm(s)]=1; else a[norm(s)]=1; });
  return {plain:a, area:pl};
}
var RC=null;
function regIndex(){
  if(RC) return RC;
  RC={porInd:{}, sinInd:{}};
  var sets=S.ind.map(function(i){return [i,aliasSet(i)];});
  S.reg.forEach(function(r){
    var n=norm(r.ind), na=norm((r.a||'')+'|'+r.ind), hit=null;
    for(var j=0;j<sets.length&&!hit;j++) if(sets[j][1].area[na]) hit=sets[j][0];
    for(j=0;j<sets.length&&!hit;j++) if(sets[j][1].plain[n]) hit=sets[j][0];
    r._i=hit?hit.id:null;
    if(hit){ var m=RC.porInd[hit.id]=RC.porInd[hit.id]||{}; (m[r.f]=m[r.f]||[]).push(r); }
    else { var key=(r.a||'')+'|'+r.ind; RC.sinInd[key]=(RC.sinInd[key]||0)+1; }
  });
  return RC;
}
function regsDia(ind,f){
  var m=regIndex().porInd[ind.id]||{}, out=[];
  for(var k=0;k<=S.cfg.tol;k++){ var d=addDias(f,k); if(m[d]) out=out.concat(m[d]); }
  return out;
}
function invalidar(){GC={};RC=null;}

/* Resumen de un indicador en un mes */
function resumen(ind,mes){
  var g=gatillo(ind,mes), dd=S.datos[ind.id]||{}, dias=[], c={dato:0,R:0,c5:0,ok:0,hechoR:0,hecho5:0,pend:0,reg:0};
  var n=diasMes(mes);
  for(var d=1;d<=n;d++){
    var f=mes+'-'+pad(d), x=dd[f], rg=regsDia(ind,f);
    // Los días inventados (o 'i') solo sirven para calcular el gatillo: no cuentan como días que lo pasaron.
    var v=x?x.v:null, lv=x&&x.o==='i'?'':nivel(ind,v,g);
    if(x) c.dato++;
    var tieneR=rg.some(function(r){return r.t==='R';}), tiene5=rg.some(function(r){return r.t==='5';});
    var est='';
    if(lv==='R'){c.R++; if(tieneR){c.hechoR++;est='hecho';} else {c.pend++;est=tiene5?'parcial':'pend';}}
    else if(lv==='5'){c.c5++; if(tieneR||tiene5){c.hecho5++;est='hecho';} else {c.pend++;est='pend';}}
    else if(lv==='ok') c.ok++;
    if(x||rg.length) dias.push({f:f,v:v,x:x,lv:lv,est:est,rg:rg});
  }
  // registros del mes de este indicador (aunque no haya dato del día)
  var m=regIndex().porInd[ind.id]||{}; for(var f2 in m) if(f2.slice(0,7)===mes) c.reg+=m[f2].length;
  c.disp=c.R+c.c5; c.hecho=c.hechoR+c.hecho5; c.adh=c.disp?c.hecho/c.disp:null;
  return {g:g,dias:dias,c:c};
}
function stAdh(p){return p==null?'none':p>=.9?'good':p>=.6?'warn':'crit';}

/* ---------------- lectura de Excel ---------------- */
function leerArchivo(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ try{ res(XLSX.read(new Uint8Array(fr.result),{type:'array',cellDates:true})); }catch(e){rej(e);} };
    fr.onerror=function(){rej(fr.error);};
    fr.readAsArrayBuffer(file);
  });
}
function filas(ws){return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});}
function hoja(wb,nombre){var n=norm(nombre);for(var i=0;i<wb.SheetNames.length;i++) if(norm(wb.SheetNames[i])===n) return wb.Sheets[wb.SheetNames[i]];return null;}

async function procesar(files){
  var msgs=[], errs=[];
  for(var i=0;i<files.length;i++){
    var f=files[i];
    try{
      var wb=await leerArchivo(f);
      if(hoja(wb,'Indicadores')||hoja(wb,'Datos')||hoja(wb,'Gatillos fijos')||hoja(wb,'Plan')) msgs.push(cargarPlantilla(wb,f.name));
      else { var r=cargarForms(wb,f.name); if(r.err) errs.push(r.err); else msgs.push(r.msg); }
    }catch(e){ errs.push(f.name+': no se pudo leer ('+(e&&e.message||e)+').'); }
  }
  invalidar(); guardar(); render();
  if(errs.length) flash('crit','<b>Revisa:</b><ul>'+errs.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>'+(msgs.length?'<p>'+msgs.map(esc).join('<br>')+'</p>':''),true);
  else if(msgs.length) flash('ok',msgs.map(esc).join('<br>'),true);
}

/* Plantilla: si trae "Indicadores" reemplaza todo (catálogo, datos, gatillos fijos y plan). Si solo trae "Datos" o "Plan", los agrega. */
function cargarPlantilla(wb,nombre){
  var wsI=hoja(wb,'Indicadores'), wsD=hoja(wb,'Datos'), wsF=hoja(wb,'Gatillos fijos'), wsP=hoja(wb,'Plan'), partes=[], omit=0;
  if(wsI){
    var rows=filas(wsI), h=rows.shift()||[], cat=[];
    rows.forEach(function(r){ if(r[0]!=null&&String(r[0]).trim()) cat.push(nuevoInd(r)); });
    // conservar ids de indicadores que ya existen (para no perder datos escritos a mano si no vienen en "Datos")
    var viejos={}; S.ind.forEach(function(i){viejos[norm(i.nombre)]=i.id;});
    cat.forEach(function(i){ if(viejos[norm(i.nombre)]) i.id=viejos[norm(i.nombre)]; });
    S.ind=cat; partes.push(cat.length+' indicadores');
  }
  var byN={}; S.ind.forEach(function(i){byN[norm(i.nombre)]=i;});
  if(wsD){
    var nuevos={}, n=0, sinInd={};
    filas(wsD).slice(1).forEach(function(r){
      var ind=byN[norm(r[0])]; if(!ind){ if(r[0]!=null&&String(r[0]).trim()) sinInd[r[0]]=1; return; }
      var fe=parseFecha(r[1]), v=parseVal(r[2],ind.unidad); if(!fe||v==null){omit++;return;}
      var o=/excel anterior/i.test(String(r[3]||''))?'x':/inventad/i.test(String(r[3]||''))?'i':'p';
      (nuevos[ind.id]=nuevos[ind.id]||{})[fe]={v:v,o:o}; n++;
    });
    if(wsI) S.datos=nuevos;
    else for(var id in nuevos){ S.datos[id]=S.datos[id]||{}; for(var fe in nuevos[id]) S.datos[id][fe]=nuevos[id][fe]; }
    partes.push(n+' datos'+(wsI?'':' agregados'));
    var si=Object.keys(sinInd); if(si.length) partes.push('se ignoraron datos de indicadores que no están en el catálogo: '+si.join(', '));
  }
  if(wsF){
    var fx={}, k=0;
    filas(wsF).slice(1).forEach(function(r){
      var ind=byN[norm(r[0])]; if(!ind) return;
      var m=r[1] instanceof Date ? r[1].getFullYear()+'-'+pad(r[1].getMonth()+1) : String(r[1]||'').trim().replace(/^(\d{4})[\/-](\d{1,2}).*$/,function(_,y,mm){return y+'-'+pad(+mm);});
      if(!/^\d{4}-\d{2}$/.test(m)){omit++;return;}
      var v=parseVal(r[2],ind.unidad); if(v==null){omit++;return;}
      (fx[ind.id]=fx[ind.id]||{})[m]=v; k++;
    });
    if(wsI) S.fijos=fx; else for(var id2 in fx){S.fijos[id2]=S.fijos[id2]||{}; for(var m2 in fx[id2]) S.fijos[id2][m2]=fx[id2][m2];}
    partes.push(k+' gatillos fijos');
  }
  if(wsP){
    var pl=[], sinP={};
    filas(wsP).slice(1).forEach(function(r){
      if(r[0]==null||!String(r[0]).trim()) return;
      var ind=byN[norm(r[0])], fe=parseFecha(r[1]);
      if(!ind){ sinP[r[0]]=1; return; }
      if(!fe){ omit++; return; }
      var p=nuevoPlan(ind.id,fe,/5/.test(String(r[2]||''))?'5':'R',String(r[3]||'').trim(),parseFecha(r[4])||'',String(r[5]||'').trim());
      p.hecho=/^s[ií]/i.test(String(r[6]||'').trim()); pl.push(p);
    });
    if(wsI){ S.plan=pl; partes.push(pl.length+' análisis en el plan'); }
    else {
      var nn=0, na=0;
      pl.forEach(function(p){
        var ex=S.plan.filter(function(q){return q.ind===p.ind&&q.f===p.f&&q.t===p.t;})[0];
        if(!ex){ S.plan.push(p); nn++; return; }
        if(p.resp) ex.resp=p.resp; if(p.lim) ex.lim=p.lim; if(p.nota) ex.nota=p.nota; if(p.hecho) ex.hecho=true; na++;
      });
      partes.push(nn+' análisis agregados al plan'+(na?' · '+na+' actualizados':''));
    }
    var sp=Object.keys(sinP); if(sp.length) partes.push('se ignoraron filas del plan con indicadores que no están en el catálogo: '+sp.join(', '));
  }
  if(omit) partes.push(omit+' filas sin fecha o valor válido se omitieron');
  return nombre+': '+partes.join(' · ')+'.';
}

/* Exportación de Microsoft Forms (Relatos de Anomalía o 5XQ). Reemplaza los registros de ese tipo. */
function cargarForms(wb,nombre){
  var best=null;
  wb.SheetNames.forEach(function(sn){
    var rows=filas(wb.Sheets[sn]);
    for(var i=0;i<Math.min(12,rows.length);i++){
      var h=(rows[i]||[]).map(norm);
      if(h.some(function(x){return x.indexOf('indicador')>=0;}) && h.filter(Boolean).length>=5){ if(!best||rows.length>best.rows.length) best={sn:sn,rows:rows,hi:i}; break; }
    }
  });
  if(!best) return {err:nombre+': no parece una exportación de Relatos o 5XQ (no encontré la columna "Indicador"). Si es la plantilla, debe tener las hojas "Indicadores" y "Datos".'};
  var H=best.rows[best.hi].map(norm), col=function(fn){for(var i=0;i<H.length;i++) if(H[i]&&fn(H[i])) return i; return -1;};
  var cols=function(fn){var o=[];for(var i=0;i<H.length;i++) if(H[i]&&fn(H[i])) o.push(i);return o;};
  var C={
    fecha:col(function(h){return h==='fecha'||h==='fecha ';}),
    fecha2:col(function(h){return /^fecha/.test(h)&&!/plan|realizacion|creacion/.test(h);}),
    fin:col(function(h){return /completion time|hora de finalizacion/.test(h);}),
    centro:col(function(h){return h==='cdd'||/^centro|^cd$|agencia/.test(h);}),
    area:col(function(h){return /^area/.test(h);}),
    ind:cols(function(h){return h.indexOf('indicador')>=0;}),
    resp:cols(function(h){return /responsable|supervisor|conferente/.test(h);}),
    chofer:col(function(h){return /chofer|nombre del funcionario/.test(h)||h==='nombre';}),
    ruta:col(function(h){return /^ruta/.test(h);}),
    res:col(function(h){return /^resultado/.test(h)&&!/ruta/.test(h);}),
    resRuta:col(function(h){return /^resultado ruta/.test(h);}),
    pq:cols(function(h){return /por ?que/.test(h);}),
    causa:col(function(h){return /causa/.test(h);}),
    acc:col(function(h){return /accion/.test(h)&&!/safety/.test(h);}),
    cron:col(function(h){return /cronica/.test(h);})
  };
  if(C.fecha<0) C.fecha=C.fecha2>=0?C.fecha2:C.fin;
  var es5 = /5\s*x\s*q|5xq|5 porq|5 why/i.test(nombre+' '+best.sn) || H.some(function(h){return /supervisor de turno|conferente|^chofer/.test(h);});
  var t=es5?'5':'R', out=[], otros=0, sinF=0;
  best.rows.slice(best.hi+1).forEach(function(r){
    var g=function(i){return i>=0&&r[i]!=null?String(r[i]).trim():'';};
    var ind=''; for(var j=0;j<C.ind.length&&!ind;j++) ind=g(C.ind[j]);
    if(!ind||ind==='*') return;
    var cen=g(C.centro); if(cen&&!/bavaro/.test(norm(cen))){otros++;return;}
    var fe=parseFecha(C.fecha>=0?r[C.fecha]:null)||parseFecha(C.fin>=0?r[C.fin]:null); if(!fe){sinF++;return;}
    var resp=''; for(j=0;j<C.resp.length&&!resp;j++) resp=g(C.resp[j]);
    var pq=C.pq.map(function(i){return g(i);}).filter(Boolean);
    if(pq.length&&pq.every(function(p){return /^prueba$/i.test(p);})) return;
    out.push({t:t,f:fe,a:g(C.area),ind:ind,resp:resp,chofer:g(C.chofer),ruta:g(C.ruta),res:g(C.res)||g(C.resRuta),
      pq1:(pq[0]||'').slice(0,240),causa:g(C.causa).slice(0,400),acc:g(C.acc).slice(0,400),cron:/^s/i.test(g(C.cron))?'Sí':g(C.cron)?'No':''});
  });
  if(!out.length) return {err:nombre+': no encontré registros de Bávaro con fecha e indicador'+(otros?' ('+otros+' eran de otros centros)':'')+'.'};
  S.reg=S.reg.filter(function(x){return x.t!==t;}).concat(out);
  var fs=out.map(function(x){return x.f;}).sort();
  S.regMeta[t]={archivo:nombre,cargado:ymd(new Date()),n:out.length,desde:fs[0],hasta:fs[fs.length-1]};

  var ind=indById(p.ind);
  if(ind&&regsDia(ind,p.f).some(function(r){return p.t==='5'||r.t==='R';})) return 'forms';
  if(p.hecho) return 'hecho';
  if(p.lim&&p.lim<ymd(new Date())) return 'venc';

}

function dibujarChart(){
  var box=$('chart'); if(!box) return;
  var i=indById(UI.ind), r=resumen(i,UI.mes), g=r.g, n=diasMes(UI.mes), dd=S.datos[i.id]||{};
  var pts=[]; for(var d=1;d<=n;d++){var f=UI.mes+'-'+pad(d); if(dd[f]) pts.push({d:d,f:f,v:dd[f].v,lv:dd[f].o==='i'?'':nivel(i,dd[f].v,g)});}
  if(!pts.length){box.innerHTML='<p class="sub" style="padding:24px 0">Sin datos diarios en '+esc(mesNombre(UI.mes))+'.</p>';return;}
  var W=Math.max(320,box.clientWidth||900), H=260, L=64, R=12, T=14, B=26;
  var vs=pts.map(function(p){return p.v;}); if(g.v!=null){vs.push(g.v);vs.push(g.v5);}
  var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs); if(lo===hi){lo-=Math.abs(lo)*.1||1;hi+=Math.abs(hi)*.1||1;}
  var pd=(hi-lo)*.08; lo-=pd; hi+=pd;
  var x=function(dd){return L+(dd-1)/(Math.max(1,n-1))*(W-L-R);}, y=function(v){return T+(hi-v)/(hi-lo)*(H-T-B);};
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Valores diarios de '+esc(i.nombre)+' contra el gatillo">';
  for(var k=0;k<=4;k++){var v=lo+(hi-lo)*k/4,yy=y(v);s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+esc(fmt(v,i.unidad))+'</text>';}
  for(d=1;d<=n;d+=(W<520?4:2)) s+='<text x="'+x(d)+'" y="'+(H-6)+'" text-anchor="middle">'+d+'</text>';
  s+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'"/>';
  if(g.v!=null){s+='<line class="g5" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g.v5)+'" y2="'+y(g.v5)+'"/><line class="gR" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g.v)+'" y2="'+y(g.v)+'"/>';}
  s+='<polyline class="ln" points="'+pts.map(function(p){return x(p.d)+','+y(p.v);}).join(' ')+'"/>';
  pts.forEach(function(p){var c=p.lv==='R'?'var(--crit)':p.lv==='5'?'var(--warn)':'var(--series)';s+='<circle data-tip="'+esc(fechaCorta(p.f)+' · '+fmt(p.v,i.unidad))+'" cx="'+x(p.d)+'" cy="'+y(p.v)+'" r="'+(p.lv==='R'||p.lv==='5'?5:3.5)+'" fill="'+c+'"/>';});
  s+='</svg><div class="tip" id="tip" hidden></div>';
  box.innerHTML=s;
  box.querySelector('svg').addEventListener('mousemove',function(e){
    var t=e.target.closest('circle'), tip=$('tip'); if(!t){tip.hidden=true;return;}
    var b=box.getBoundingClientRect(), c=t.getBoundingClientRect(); tip.textContent=t.dataset.tip; tip.hidden=false;
    tip.style.left=(c.left+c.width/2-b.left)+'px'; tip.style.top=(c.top-b.top)+'px';
  });
  box.querySelector('svg').addEventListener('mouseleave',function(){$('tip').hidden=true;});
}

function pegarDatos(){
  var txt=$('pegar').value, ok=0, mal=[], byN={}; S.ind.forEach(function(x){byN[norm(x.nombre)]=x;});
  var def=indById(UI.datInd);
  txt.split(/\r?\n/).forEach(function(l,ix){
    if(!l.trim()) return;
    var p=l.split(/\t|;/); if(p.length<2) p=l.split(',');
    p=p.map(function(s){return s.trim();}).filter(function(s){return s!=='';});
    var ind=def, fe, v;
    if(p.length>=3&&byN[norm(p[0])]){ind=byN[norm(p[0])];p=p.slice(1);}
    else if(p.length>=3){ // valor con coma decimal partido: "3,1"
      p=[p[0],p.slice(1).join(',')]; }
    fe=parseFecha(p[0]); v=parseVal(p[1],ind.unidad);
    if(!fe||v==null){mal.push(ix+1);return;}
    (S.datos[ind.id]=S.datos[ind.id]||{})[fe]={v:v,o:'m'}; ok++;
